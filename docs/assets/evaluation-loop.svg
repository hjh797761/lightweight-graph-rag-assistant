<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Evaluation loop">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 27px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .sub { font: 400 14px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .box { fill: #fff; stroke: #d7e0ea; stroke-width: 1.3; }
      .head { font: 700 17px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .txt { font: 400 13px "Segoe UI", "Microsoft YaHei", sans-serif; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .ok { fill: #ecfdf5; stroke: #86efac; }
      .warn { fill: #fff7ed; stroke: #fed7aa; }
    </style>
  </defs>
  <rect width="1100" height="520" rx="26" fill="#f8fafc"/>
  <text x="48" y="58" class="title">评测闭环：不只看分数，更看证据是否真的命中</text>
  <text x="50" y="86" class="sub">最终汇报建议用“三方对比 + 人工核查表”，避免被单一自动评分误导。</text>

  <rect x="70" y="150" width="210" height="120" rx="14" class="box"/>
  <text x="105" y="188" class="head">测试题集</text>
  <text x="105" y="222" class="txt">事实题 / 原因题 / 跨页题</text>
  <text x="105" y="248" class="txt">反幻觉题 / 多文档题</text>

  <rect x="365" y="120" width="340" height="180" rx="14" class="box"/>
  <text x="405" y="158" class="head">三方系统对比</text>
  <text x="405" y="195" class="txt">NaiveRAG：基础检索 baseline</text>
  <text x="405" y="225" class="txt">Original GraphRAG：冻结稳定版</text>
  <text x="405" y="255" class="txt">Experimental GraphRAG：实验优化版</text>

  <rect x="790" y="120" width="250" height="180" rx="14" class="warn"/>
  <text x="824" y="158" class="head">人工核查维度</text>
  <text x="824" y="195" class="txt">证据命中 / 漏主体</text>
  <text x="824" y="225" class="txt">数字与原因是否准确</text>
  <text x="824" y="255" class="txt">是否跨页整合 / 是否幻觉</text>

  <rect x="278" y="365" width="545" height="90" rx="16" class="ok"/>
  <text x="326" y="400" class="head">只接受通用改进</text>
  <text x="326" y="430" class="txt">如果实验版不稳定，保留为探索记录；只有明显不降级，才合并进正式版。</text>

  <path d="M282 210 L357 210" class="arrow"/>
  <path d="M707 210 L782 210" class="arrow"/>
  <path d="M915 305 C850 360, 780 392, 825 410" class="arrow"/>
  <path d="M276 410 C160 392, 115 315, 160 275" class="arrow"/>
</svg>
